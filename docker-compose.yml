# docker compose up --build        then open http://localhost:5173
# Paper trading by default. Copy .env.example to .env first (see INSTALL.md).
name: ashwax

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashwax}
      POSTGRES_DB: ashwax
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ashwax"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    build: .
    image: ashwax:latest
    restart: "no"          # a crashed trading stack waits for a human, same as the Windows service
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-ashwax}@db:5432/ashwax
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"   # the dashboard; the API is internal
    volumes:
      - ./config:/app/config   # edits made in the dashboard Configuration tab persist
      - ashwax_logs:/app/logs
      - ashwax_data:/app/data

volumes:
  pgdata:
  ashwax_logs:
  ashwax_data:
